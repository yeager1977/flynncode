    <path d="M54 30 C82 20 120 20 148 26 L168 42 L162 64 L122 74 C94 78 70 72 54 58 Z" fill="#FBFCFD"/>
    <path d="M44 24 L74 38 L70 68 L42 56 Z" fill="#FBFCFD"/>
    <path d="M-8 40 L16 34 L24 28 L28 8 L42 24 L48 2 L60 22 L66 36 L66 48 L54 54 L24 54 L-4 48 Z" fill="#FBFCFD"/>
    <path d="M31 20 L34 12 L40 22 Z" fill="#94A0AF"/>
    <path d="M49 16 L52 8 L58 20 Z" fill="#94A0AF"/>
    <circle cx="-4" cy="42" r="4" fill="#0A1F3D"/>
