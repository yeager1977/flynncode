apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sync-hub-data
  namespace: flynncode-sync
  labels:
    app.kubernetes.io/name: sync-hub
    app.kubernetes.io/part-of: flynncode-sync
spec:
  # Cluster default StorageClass applies when storageClassName is unset.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
