apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sync-hub-data
  namespace: 4mgrowing
  labels:
    app.kubernetes.io/name: sync-hub
    app.kubernetes.io/part-of: flynncode-sync
spec:
  # NFS-backed RWO on deepthought; survives pod reschedule.
  storageClassName: standard-rwo
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
