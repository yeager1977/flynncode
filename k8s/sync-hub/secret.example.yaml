# Copy to secret.yaml, fill in real values, and NEVER commit secret.yaml.
#   cp secret.example.yaml secret.yaml
#   kubectl -n 4mgrowing apply -f secret.yaml
# All values here are placeholders. No real tokens.
apiVersion: v1
kind: Secret
metadata:
  name: sync-hub-secrets
  namespace: 4mgrowing
  labels:
    app.kubernetes.io/name: sync-hub
    app.kubernetes.io/part-of: flynncode-sync
type: Opaque
stringData:
  # Password for the hub server (OPENCODE_SERVER_PASSWORD). Spokes use this
  # plus their pairing token to authenticate sync traffic.
  server-password: CHANGEME-generate-with-openssl-rand-base64-32
  # Shared spoke token for the hub gateway (HUB_SYNC_TOKEN). All spokes
  # verify against this one value: 64 hex chars, e.g. openssl rand -hex 32.
  hub-sync-token: CHANGEME-openssl-rand-hex-32
  # Initial 6-digit pairing code (HUB_PAIRING_CODE). Single-use: after each
  # successful pairing the hub logs a fresh code for the next spoke.
  hub-pairing-code: "123456"
  # Reserved shape for pre-seeded spoke pairing tokens. Pairing today is
  # interactive (see README "Pair a spoke"); this key documents the shape
  # for automation later. No real tokens.
  hub-sync-tokens: |
    {
      "peers": [
        { "name": "spoke-laptop-example", "token": "CHANGEME-pairing-token" }
      ]
    }
  # Object-storage target for the nightly backup CronJob.
  s3-endpoint: https://CHANGEME-s3-compatible-endpoint
  s3-bucket: CHANGEME-sync-hub-backups
  s3-access-key: CHANGEME
  s3-secret-key: CHANGEME
