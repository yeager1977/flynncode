apiVersion: v1
kind: Service
metadata:
  name: sync-hub
  namespace: 4mgrowing
  labels:
    app.kubernetes.io/name: sync-hub
    app.kubernetes.io/part-of: flynncode-sync
spec:
  # LAN-reachable by design: spokes on the LAN reach the hub at
  # <node-ip>:32097. Sync traffic is Bearer + HMAC signed, so no
  # additional auth layer. No LoadBalancer, no Ingress.
  type: NodePort
  selector:
    app.kubernetes.io/name: sync-hub
  ports:
    - name: sync
      port: 4097
      targetPort: 4097
      nodePort: 32097
      protocol: TCP
